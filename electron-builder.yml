appId: es.jscode.forma
productName: Forma
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  - out/**
  - package.json
  - engines/**
  - plugins/**
asarUnpack:
  - engines/**
  - plugins/**
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.graphics-design
  target: [dmg, zip]
  identity: null
linux:
  category: Graphics
  maintainer: Forma contributors <forma@users.noreply.github.com>
  target: [AppImage, deb]
